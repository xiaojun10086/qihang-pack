# 「启航」学伴包 v2.9 · 唯一需要按学期 / 课程修改的文件
# 新学期执行 `bash scripts/qihang.sh new-term` 会先备份再提示重置。

# ============ 学校绑定（强绑定） ============
school:
  name: 大连理工大学
  short: 大工 / DUT
  domain: dlut.edu.cn
  official: https://www.dlut.edu.cn/
  entry_sso: https://sso.dlut.edu.cn/
  entry_portal: https://portal.dlut.edu.cn/
  entry_jwgl: http://jxgl.dlut.edu.cn/student/ucas-sso/login
  webvpn: https://webvpn.dlut.edu.cn/
  app: i大工
  sites_public: references/dlut-official-sites.md
  sites_private: references/dlut-login-sites.md

student:
  campus: 凌水主校区      # 凌水主校区 / 开发区校区 / 盘锦校区
  college: 待填写          # 例：计算机科学与技术学院
  grade: 2026

# ============ 学期配置 ============
term: 2026-2027-1
courses:
  - 高等数学
  - 大学物理
  - 程序设计基础
exam_weeks:
  - 第9周
  - 第17周
sleep_window: "23:30-07:00"

# ============ 1 级库参数 ============
library:
  clarity:
    threshold: 0.30
    max_rounds: 3
    max_questions_per_round: 3
    weights: {O: 1.5, T: 1.5, D: 1.5, W: 0.8, C: 0.6, B: 0.2}
    ask_priority: {W: 3.0, O: 2.5, D: 2.0, C: 1.5, B: 1.0, T: 0.5}
    skip_when:
      - 命中校情横切且对象明确
      - 用户显式要求"直接给结果"
  policy:
    local_first: true          # 库内优先（硬规则）
    forbid_fabricate_url: true # 禁止编造 DUT URL
    write_learning_records: true
    never_write_sensitive: [F3, F5]   # 整域不写入档案（F3 身心 / F5 健康）
    partial_write_sensitive: [F4, F6] # 排除敏感字段后写入（金额债务 / 伤病）

# ============ 私密站接入（方案 A · 受控浏览器） ============
private_sites:
  mode: controlled_browser     # A 受控浏览器 | B 手动投喂 | C 仅登记
  user_authorized: true
  require_isolated_profile: true            # ★强制：不得复用用户真实浏览器 profile
  profile_dir: "~/.qihang/browser-profile"  # ★独立 profile 目录
  verify_on_exit: [close_all, session_list_empty]
  read_only: true
  persist_cookies: false
  persist_pages: false
  # 实测最佳聚合点（2026-10-01 验证）：单页拿到课表 / 借阅/一卡通/网费/邮件/日程
  primary_aggregator: https://portal.dlut.edu.cn/
  level_rules:
    # v2.7 修复：去掉生成器拼接残留的重复项（原为 "…网费, 网费, 日程"）
    L1_auto: [课表, 成绩等级, 考试安排, 借阅, 一卡通余额, 场馆预约状态, 网费, 日程]
    L2_confirm: [资助申请状态, 就业投递记录, 培养进度, 邮箱未读提示]
    # 口径：成绩「等级/是否通过」可读；「明细」禁读（见 references/dlut-field-map.md）
    L3_forbidden: [缴费金额, 银行卡, 身份证, 家庭信息, 邮件正文, 心理记录, 成绩明细]

# ============ 能力域开关（19 域） ============
domains:
  S1: true   # 课程答疑        S2: true   # 课堂与笔记
  S3: true   # 作业与考核      S4: true   # 备考与记忆
  S5: true   # 学术表达        S6: true   # 语言能力
  F1: true   # 校园事务        F2: true   # 作息与专注
  F3: true   # 身心与社交      F4: true   # 财务与安全
  F5: true   # 健康与运动      F6: true   # 军训与志愿
  F7: true   # 升学深造        F8: true   # 求职与竞赛
  R1: true   # 文献检索与管理  R2: true   # 实验与数据
  R3: true   # 科研工具与代码  R4: true   # 学术产出与投稿
  R5: true   # 学术规范与伦理
