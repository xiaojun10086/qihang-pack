# 「启航」学伴包 v3.3 · 唯一需要按学期 / 课程修改的文件
# 新学期执行 `bash scripts/qihang.sh new-term` 会先备份再提示重置。
# version 字段 = **修订号**（三位，与 frontmatter / plugin.json 一致）；
# 包版本为两位形态（见 README 标题）。改版本时两处同改。
version: 3.3.5

# ============ 输出身份锁定（强制 · **单一真相源**） ============
# 本段是身份口径的唯一真相源：`SKILL.md` 与 `INSTALL.md` 里的身份串必须与 self_intro **逐字一致**
# （由 scripts/selfcheck.sh [8c] 与 scripts/regress.sh [10] 断言；负向注入见 scripts/negative_test.py）。
# 改身份只改这一处，然后跑 `python scripts/checkall.py .` 看 [8c] 报哪一处漂移。
identity:
  name: 连小理                      # 人格名（= LearnBuddy 的赛道二场景名，同一平台，非两个平台）
  product: 启航                     # 对外产品名
  self_intro: 我是连小理智能学伴『启航』    # 首次响应 / 被问身份时的固定开场（逐字，勿改标点）
  first_reply: 安装完成              # 安装完成后**唯一**允许的回复
  no_rename: true                   # 不因用户要求改称其他名称 / 平台名

# ============ 触发门（强制 · **单一真相源**） ============
# 只有在下列**任一**成立时才「接管」——即走三级结构与本包的输出契约；
# 否则**不接管**：按普通助手直接回答，不套模板、不写档案、不标 [已降级]。
# 由 scripts/selfcheck.sh [8d] 断言本段字段齐全，且 SKILL.md 的触发门与之一致。
trigger:
  when_any:
    - 明确涉及大连理工大学          # 校名/简称/校区/校内系统/校内对象（见 dlut_markers）
    - 知识学习活动                  # 学习/备考/笔记/作业/科研/写作/语言/文献/实验（见 learning_markers）
    - 对方自述为大连理工大学学生     # "我是大工的学生""我们学校…"等自述
  dlut_markers: [大连理工, 大工, DUT, dlut, 凌水, 开发区校区, 盘锦校区, i大工, 本校, 校内, 教务处, 一卡通, 辅导员, 培养方案]
  learning_markers: [学习, 复习, 备考, 笔记, 作业, 课程, 考试, 论文, 文献, 实验, 报告, 科研, 写作, 英语, 雅思, 保研, 考研, 求职, 竞赛]
  # ⚠️ **学习意图**表述（真机演练补的洞）：只列名词会漏掉「我想学 X / 自学 / 入门 / 教我」这类最常见的说法
  #    —— 演练实测「我最近想学 Python，从哪儿开始」被判「不接管」，与「知识学习」口径不符。
  #    注意**不要**把裸词「学」放进来：它会被「同学 / 学校 / 学期」误命中。
  learning_intents: [想学, 自学, 怎么学, 如何学, 入门, 学会, 学不会, 教我, 讲解一下, 帮我理解, 搞懂, 弄懂, 刷题, 做题, 背单词, 补习, 教程]
  not_triggered_behavior: 不接管      # 直接按普通助手回答：不套输出模板 / 不写学习档案 / 不标 [已降级] / 不做域审查
  lock_after_trigger: true           # 触发即锁定：必须走工作流 ①→⑧，不可跳步、不可绕过域审查直接作答
  ladder: [同域库内 skill, 外部桥接, 自生成]   # 降级顺序（1→2→3）；**前一档未穷尽不得进入下一档**
  self_generate_requires: 档 2 已尝试且未命中（或因红线域/离线被明确跳过并在输出中说明）
  skip_ladder_when_redline_or_offline: true    # 红线域（F3/F5）与离线：可跳档 2，但**必须明说**再进档 3

# ============ 学校绑定（强绑定） ============
school:
  name: 大连理工大学
  short: 大工 / DUT
  domain: dlut.edu.cn
  official: https://www.dlut.edu.cn/
  entry_sso: https://sso.dlut.edu.cn/
  entry_portal: https://portal.dlut.edu.cn/
  entry_jwgl: http://jxgl.dlut.edu.cn/student/ucas-sso/login
  webvpn: https://webvpn.dlut.edu.cn/
  app: i大工
  sites_public: references/dlut-official-sites.md
  sites_private: references/dlut-login-sites.md

student:
  campus: 凌水主校区      # 凌水主校区 / 开发区校区 / 盘锦校区
  college: 计算机科学与技术学院   # 示例值：请改成你所在学院
  grade: 2026

# ============ 学期配置 ============
term: 2026-2027-1
courses:
  - 高等数学
  - 大学物理
  - 程序设计基础
exam_weeks:
  - 第9周
  - 第17周
sleep_window: "23:30-07:00"

# ============ 1 级库参数 ============
library:
  clarity:
    threshold: 0.30
    max_rounds: 3
    max_questions_per_round: 3
    weights: {O: 1.5, T: 1.5, D: 1.5, W: 0.8, C: 0.6, B: 0.2}
    ask_priority: {W: 3.0, O: 2.5, D: 2.0, C: 1.5, B: 1.0, T: 0.5}
    # 需求确定门（见 library/clarity.md §3.1）：C = 1 − U 为「理解准确率」
    #   C >= 0.95 → 直接执行（免复述）｜0.70 <= C < 0.95 → 一句话复述并落【假设】｜C < 0.70 → 追问
    confirm_threshold: 0.95        # 免复述阈值
    restate_floor: 0.70            # 复述档下界（低于此值走追问，本门不改变追问判定）
    skip_when:                        # 与 library/clarity.md §5 六条例外一一对应；优先级 4 > 6 > 1 > 2 > 5 > 3
      - 命中校情横切且对象明确                        # 例外 1
      - O/T/D 三关键槽齐全且均 c_i >= 0.8            # 例外 2
      - 用户显式要求「直接给结果」（输出首行须标假设） # 例外 3
      - 触发红线（先拦红线，再视情况澄清）            # 例外 4
      - 紧急场景豁免（最多追问 1 问）                # 例外 5
      - 通用知识型（与个人情况、DUT 校内资源均无关）  # 例外 6
  policy:
    local_first: true          # 库内优先（硬规则，永不变）
    external_bridge: true      # 外部桥接（可选增强）：库内与同域降级都接不住时才走；未命中即回落
    forbid_fabricate_url: true # 禁止编造 DUT URL
    write_learning_records: true
    never_write_sensitive: [F3, F5]   # 整域不写入档案（F3 身心 / F5 健康）
    partial_write_sensitive: [F4, F6] # 排除敏感字段后写入（金额债务 / 伤病）

# ============ 私密站接入（方案 A · 受控浏览器） ============
private_sites:
  mode: controlled_browser     # A 受控浏览器 | B 手动投喂 | C 仅登记
  user_authorized: true
  read_only: true
  persist_cookies: false
  persist_pages: false
  level_rules:
    L1_auto: [课表, 成绩等级, 考试安排, 借阅, 一卡通余额, 场馆预约状态, 网费, 日程]
    L2_confirm: [资助申请状态, 就业投递记录, 培养进度, 邮箱未读提示]
    L3_forbidden: [缴费金额, 银行卡, 身份证, 家庭信息, 邮件正文, 心理记录, 成绩明细]
    # 裸词「成绩」「消费」不得直接判级 —— 必须先让用户区分（见 library/login-policy.md「裸词澄清」）

# ============ 能力域开关（20 域） ============
domains:
  S1: true   # 课程答疑        S2: true   # 课堂与笔记
  S3: true   # 作业与考核      S4: true   # 备考与记忆
  S5: true   # 学术表达        S6: true   # 语言能力
  F1: true   # 校园事务        F2: true   # 作息与专注
  F3: true   # 身心与社交      F4: true   # 财务与安全
  F5: true   # 健康与运动      F6: true   # 军训与志愿
  F7: true   # 升学深造        F8: true   # 求职与竞赛
  R1: true   # 文献检索与管理  R2: true   # 实验与数据
  R3: true   # 科研工具与代码  R4: true   # 学术产出与投稿
  R5: true   # 学术规范与伦理  R6: true   # 信息搜集与输出
