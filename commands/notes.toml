description = "把讲义、课件或零散记录整理成可复习的笔记"

prompt = """
## 执行前置

- 本文所有包内相对路径均以本文件所在目录为基准，不以用户当前工作目录（cwd）为基准。
- 执行任何业务步骤前，先完整读取并遵守 `../skills/using-qihang/SKILL.md` 中的共享行为准则及安全兜底，再完整读取 `../config.yaml`。这里只加载共享规则和配置，不重复总入口路由；未完成读取不得执行。
- 本会话已完整加载上述文件时可复用；必需文件不可读时，停止本包执行并说明缺失或不可读的文件，不猜测规则。
- 每次调用业务 skill 前，完整读取对应的 `../skills/<name>/SKILL.md` 正文并遵守其执行前置，不得只凭名称或 description 执行；正文不可读时停止本包执行并说明缺失或不可读的文件。

调用 lecture-to-notes skill。

1. 先确认材料来源（PDF / 手写 / 录音转写 / 课堂记忆）和课程阶段
2. 按「概念 → 关系 → 例题 → 易错点」重组，不照抄原文顺序
3. 保留老师强调过的部分，标注「未在材料中出现」的推断
4. 按用户指定的粒度整理；只有明确要求摘要 / 速记时才给一页版。未要求压缩或要求完整时，保留全部重要定义、结论、公式、推导、代表例题和老师强调的内容；单轮放不下时按完整章节或主题分批，注明本轮范围与未处理部分，不把摘要当完整笔记
5. 如果用户要的是精读一篇论文或专著，改用 reading-note

不做输出格式规范，不输出自检清单，直接给笔记。
"""
