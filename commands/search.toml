description = "检索校内公开信息、导师资料、通知节点与文献"

prompt = """
## 执行前置

- 本文所有包内相对路径均以本文件所在目录为基准，不以用户当前工作目录（cwd）为基准。
- 执行任何业务步骤前，先完整读取并遵守 `../skills/using-qihang/SKILL.md` 中的共享行为准则及安全兜底，再完整读取 `../config.yaml`。这里只加载共享规则和配置，不重复总入口路由；未完成读取不得执行。
- 本会话已完整加载上述文件时可复用；必需文件不可读时，停止本包执行并说明缺失或不可读的文件，不猜测规则。
- 每次调用业务 skill 前，完整读取对应的 `../skills/<name>/SKILL.md` 正文并遵守其执行前置，不得只凭名称或 description 执行；正文不可读时停止本包执行并说明缺失或不可读的文件。

按需求调用对应 skill：

- 机构、地点、电话、办事部门 → campus-search
- 导师研究方向、招生信息、联系方式 → advisor-finder
- 通知、报名、截止时间 → notice-track
- 文献检索与全文获取 → lit-fetch
- 核验一条引文真假 → citation-verify

通用要求：

1. 每条事实给来源（官方站点 / 通知原文 / 数据库），附日期
2. 明确区分「已核验」与「未核验」；没有实际检索就不得声称已检索
3. 查不到就明说未收录，给官网核实路径，不编造 URL、电话、单位名、时间
4. 校内信息优先官方来源，非官方来源标注来源性质
5. 先判是否需要登录：公开站直接查；只在统一认证后可见的，先给出登录要求再转 `portal-operator`——由用户本人用**自己的浏览器**登录，本包不代开浏览器、不代填用户名 / 密码 / 验证码；要本包直接操作页面时浏览器需带调试端口启动（最快捷做法：专用配置目录 + `--remote-debugging-port=0`，登录一次即长期免登录，端口写入该目录的 `DevToolsActivePort`），用户确认已登录后本包才接入。完整流程见 `../skills/portal-operator/SKILL.md`
"""
